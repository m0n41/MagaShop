{% if user.is_authenticated %}
    <form method="post" action="{% url 'wishlist:toggle' product.id %}" class="wishlist-btn-form">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button type="submit" class="wishlist-btn{% if product.id in wishlist_product_ids %} wishlist-btn--active{% endif %}" aria-label="В избранное">
            <svg viewBox="0 0 24 24" class="wishlist-btn__icon">
                <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/>
            </svg>
        </button>
    </form>
{% endif %}
