{% extends "base.html" %}

{% block sidebar %}{% endblock sidebar %}
{% block content %}
    <div class="form-page">
        <div class="form-card">
            {% if validlink %}
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit">Задать новый пароль</button>
                </form>
            {% else %}
                <p>Ссылка для сброса пароля недействительна — возможно, она уже была использована или истекла.</p>
            {% endif %}
        </div>
    </div>
{% endblock content %}
