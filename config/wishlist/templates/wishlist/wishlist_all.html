{% extends "base.html" %}

{% block sidebar %}{% endblock sidebar %}
{% block content %}
    <div class="">
        <h1>Избранное</h1>
        {% for item in wishes %}
            <div class="product-card">
                <a href="{{ item.product.get_absolute_url }}">
                    <img src="{{ item.product.image.url }}" alt="{{ item.product.name }}" class="product-card__img">
                    <p class="product-card__title">{{ item.product.name }}</p>
                    <p class="product-card__price">{{ item.product.price }} ₽</p>
                </a>
            </div>
        {% empty %}
            <p>Нет товаров</p>
        {% endfor %}
    </div>
{% endblock content %}
